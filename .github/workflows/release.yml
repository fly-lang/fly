name: Release

on:
  push:
    branches:
      - bootstrap

env:
  WIN_FILE: win-x64.zip
  LINUX_FILE: linux-x86_64.tar.gz
  MACOS_FILE: macos-arm64.tar.gz

jobs:

  build-linux:
    uses: ./.github/workflows/build-linux.yml

  build-windows:
    uses: ./.github/workflows/build-windows.yml

  build-macos:
    uses: ./.github/workflows/build-macos.yml

  release:
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Read Version from CMake
        id: version
        shell: bash
        run: |
          VERSION=$(grep -m1 'set(FLY_VERSION' CMakeLists.txt | sed 's/[^"]*"\([^"]*\)".*/\1/')
          if [ -z "$VERSION" ]; then
            echo "ERROR: Could not read version from CMakeLists.txt"
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Resolved version: $VERSION"

      - name: Resolve artifact suffix
        id: artifact
        shell: bash
        run: |
          SUFFIX="${{ github.ref_name }}"
          echo "suffix=${SUFFIX//\//-}" >> $GITHUB_OUTPUT

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-artifact-${{ steps.artifact.outputs.suffix }}
          path: ./linux

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-artifact-${{ steps.artifact.outputs.suffix }}
          path: ./windows

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-artifact-${{ steps.artifact.outputs.suffix }}
          path: ./macos

      - name: Package Linux
        run: |
          chmod +x linux/bin/*
          tar -czvf fly-${{ steps.version.outputs.version }}-${{ env.LINUX_FILE }} -C linux bin/ lib/
      - name: Package Windows
        run: |
          cd windows
          zip -r ../fly-${{ steps.version.outputs.version }}-${{ env.WIN_FILE }} *
      - name: Package macOS
        run: |
          chmod +x macos/bin/*
          tar -czvf fly-${{ steps.version.outputs.version }}-${{ env.MACOS_FILE }} -C macos bin/ lib/

      - name: Verify artifacts
        run: |
          ls -la fly-*
          [ -f "fly-${{ steps.version.outputs.version }}-${{ env.LINUX_FILE }}" ] || exit 1
          [ -f "fly-${{ steps.version.outputs.version }}-${{ env.WIN_FILE }}" ] || exit 1
          [ -f "fly-${{ steps.version.outputs.version }}-${{ env.MACOS_FILE }}" ] || exit 1

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          tag_name: v${{ steps.version.outputs.version }}
          # Create the tag on the commit THIS run built. Without it the action
          # tags the repository's default branch (`main`, the 0.14 line), so
          # every seed tag v0.13.7 .. v0.13.18 pointed at a 0.14 merge commit
          # instead of its `bootstrap` commit (fixed by hand 2026-11-16). Only
          # affects a NEW tag: a re-run for an existing version keeps its tag.
          target_commitish: ${{ github.sha }}
          name: Fly ${{ steps.version.outputs.version }}
          files: |
            fly-${{ steps.version.outputs.version }}-${{ env.LINUX_FILE }}
            fly-${{ steps.version.outputs.version }}-${{ env.WIN_FILE }}
            fly-${{ steps.version.outputs.version }}-${{ env.MACOS_FILE }}
          body: |
            Fly ${{ steps.version.outputs.version }} — bootstrap seed

            This is the C++ bootstrap compiler. Its only job is to build the
            self-hosted 0.14.x toolchain (stage 0 of the staged bootstrap); the
            language server, the package registry server and everything else a
            user runs are produced by that toolchain, not by this archive.

            Built and tested on:
            - Linux: ${{ needs.build-linux.outputs.build_info }}
            - Windows: ${{ needs.build-windows.outputs.build_info }}
            - macOS: ${{ needs.build-macos.outputs.build_info }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
