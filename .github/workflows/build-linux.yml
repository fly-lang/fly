name: Build Linux

on:
  workflow_call:
  push:
    paths-ignore:
      - '.github/workflows/**'
    branches:
      - release/*
  workflow_dispatch:

env:
  # stage0 bootstrap release (compiles the stage-1 compiler; see the stage map
  # below). 0.13.8 is cut from the current fly/ reference — it must carry the
  # header-gen/codegen fixes the self-host tree relies on.
  FLY_VERSION: "0.13.8"

jobs:

  build-linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Cache the fork LLVM tree (build/llvm: libLLVM.so + ld.lld, ~330 MB):
      # install_prerequisites.sh fetches it (libxml2-OFF dylib, so the bundled
      # release loads on any host). Bump the key suffix when the script's extracted
      # file list changes AND when bumping $LLVM_VERSION — a stale cache passes the
      # script's completeness check and is never re-saved (actions/cache saves on
      # miss only). -v2: added bin/ld.lld + bin/lld to the cached tree.
      - name: Cache fork LLVM (libxml2-off dylib)
        uses: actions/cache@v4
        with:
          path: build/llvm
          key: fly-llvm-20.1.8-linux-x86_64-dylib-v2

      # Install LLVM 20 (apt, for the dev build + object emit) + the fork LLVM dylib
      # (bundled into the release) + the bootstrap fly compiler ($FLY / PATH). Single
      # source of truth shared with local builds: it self-skips work already done and
      # wires up the env via $GITHUB_ENV/$GITHUB_PATH in CI. FLY_BUNDLE_LLVM=1 triggers
      # the fork LLVM download. Run it locally to reproduce this.
      - name: Install prerequisites (LLVM + fly)
        env:
          FLY_BUNDLE_LLVM: "1"
        run: chmod +x ./ci/linux/install_prerequisites.sh && ./ci/linux/install_prerequisites.sh

      # ── Rust-style staged bootstrap (see ci/linux/stagelib.sh) ───────────────
      # stage0  the downloaded 0.13.8 bootstrap (build/bootstrap) + its precompiled lib
      # stage1  stage0 builds runtime, std and the compiler FROM IN-TREE SOURCES
      #         into build/stage1 (build-only) and links a first bin/fly. The
      #         compiler is built against the in-tree std headers so its symbol
      #         references match the std the final binary links. The std SHIPS
      #         from this stage (reference class ABI — a self-host-built std would
      #         break header consumers of classes with interface bases).
      # stage2  that bin/fly rebuilds the runtime and the driver into the shipped
      #         build/bin + build/lib (the self-hosting fixpoint check). The
      #         compiler lib stays stage0-built, like Rust's beta-built rustc.
      # FLY_BUNDLE_LLVM=1 ships a self-contained toolchain: libLLVM.so in lib/,
      # fly + ld.lld resolving it via RUNPATH $ORIGIN/../lib.

      - name: Build runtime (stage 1)
        run: chmod +x ./ci/linux/*.sh && STAGE=1 ./ci/linux/build_runtime.sh

      - name: Build std (stage 1)
        run: STAGE=1 ./ci/linux/build_std.sh

      - name: Build compiler (stage 1)
        run: ./ci/linux/build_compiler.sh

      - name: Link fly (stage 1)
        env:
          FLY_BUNDLE_LLVM: "1"
        run: STAGE=1 ./ci/linux/build_driver.sh

      - name: Build runtime (stage 2)
        run: STAGE=2 ./ci/linux/build_runtime.sh

      - name: Link fly (stage 2)
        env:
          FLY_BUNDLE_LLVM: "1"
        run: STAGE=2 ./ci/linux/build_driver.sh

      # Compiler unit suites (compiler/test only).
      - name: Test self-host compiler
        run: chmod +x ./ci/linux/test_compiler.sh && ./ci/linux/test_compiler.sh

      # Driver + package-manager unit suites (driver/test): CLI parsing, Manifest/toml,
      # lockfile, semver/MVS resolver, registry, ToolChain, cache/checksum/json. flyp is
      # now merged into the single `fly` binary (driver package mode), so its suites live
      # in driver/test; the ci/linux/*_tools_flyp.sh scripts are kept for the future
      # lsp/registry port.
      - name: Test driver
        run: chmod +x ./ci/linux/test_driver.sh && ./ci/linux/test_driver.sh

      # Runtime unit tests (runtime/test) — the fly.runtime libc/libm FFI backend.
      # Currently empty (exercised indirectly by the std/os suites); the step is kept
      # so runtime/test/*_test.fly are picked up as soon as they're added.
      - name: Test runtime
        run: chmod +x ./ci/linux/test_runtime.sh && ./ci/linux/test_runtime.sh

      # Standard library tests (std/test/*_test.fly): str, math, data structures,
      # os.* (env/fs/io/path/time), mem, generics, inheritance/override/super.
      - name: Test std
        run: chmod +x ./ci/linux/test_std.sh && ./ci/linux/test_std.sh

      - name: Set artifact name
        id: artifact
        shell: bash
        run: |
          BRANCH="${{ github.ref_name }}"
          echo "artifact_name=linux-artifact-${BRANCH//\//-}" >> $GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.artifact_name }}
          # Both dirs: the artifact root is their common ancestor (build/), so it
          # preserves the bin/ + lib/ layout the release archive needs.
          path: |
            build/bin
            build/lib
          if-no-files-found: error
          overwrite: true
