name: Build Linux

on:
  workflow_call:
    inputs:
      debug_symbols:
        description: '"1" embeds DWARF (crash → source line); "0" for lean release artifacts.'
        required: false
        type: string
        default: "1"
  push:
    paths-ignore:
      - '.github/workflows/**'
    branches:
      - release/*
  workflow_dispatch:

env:
  # stage0 bootstrap release (compiles the stage-1 world; see the stage map
  # below). The seed is cut from the current fly/ reference — it must carry the
  # header-gen/codegen fixes the self-host tree relies on.
  FLY_VERSION: "0.13.10"

jobs:

  build-linux:
    runs-on: ubuntu-latest
    # Emit DWARF into the stage-1 build (stage0 honours --debug-symbols; the
    # self-host does not yet) so a crash symbolizes via gdb/valgrind/llvm-symbolizer.
    # release.yml passes debug_symbols="0" for lean artifacts; plain push /
    # workflow_dispatch default to "1".
    env:
      FLY_DEBUG_SYMBOLS: ${{ inputs.debug_symbols == '0' && '0' || '1' }}

    steps:
      - uses: actions/checkout@v4

      # Cache the fork LLVM tree (build/llvm, ~950 MB): stage0.sh fetches it
      # (libLLVM.so with libxml2 OFF so the bundled release loads on any host,
      # ld.lld, and the compiler-rt builtins linked into every fly-produced
      # executable — no apt LLVM anywhere). Keep the key in sync with
      # $LLVM_VERSION in the script when bumping LLVM, and bump the -vN suffix
      # whenever the script's extracted file list changes: a stale cache passes
      # the script's completeness check and actions/cache never re-saves an
      # existing key. (-v4: adds llvm/lib/clang — the compiler-rt builtins.)
      - name: Cache fork LLVM (libxml2-off dylib)
        uses: actions/cache@v4
        with:
          path: build/llvm
          key: fly-llvm-20.1.8-linux-x86_64-dylib-v4

      # ── Rust-style staged bootstrap (see ci/linux/stage1.sh) ─────────────────
      # stage0  ci/linux/stage0.sh: the downloaded bootstrap compiler ($FLY_VERSION) +
      #         its precompiled lib → build/stage0, and the fork LLVM →
      #         build/llvm (libLLVM + ld.lld + compiler-rt; NO system packages).
      # stage1  ci/linux/stage1.sh: stage0 builds runtime, std, compiler and
      #         driver FROM IN-TREE SOURCES and links the first self-host fly,
      #         all into build/stage1 (build-only). The compiler is built
      #         against the in-tree std headers so its symbol references match
      #         the std the final binary links.
      # stage2  ci/linux/stage2.sh: build/stage1/bin/fly rebuilds the runtime
      #         and the driver into the SHIPPED build/stage2 (the self-hosting
      #         fixpoint check). The std ships from stage1 (reference class
      #         ABI) and the compiler lib stays stage0-built, like Rust's
      #         beta-built rustc.
      # FLY_BUNDLE_LLVM=1 ships a self-contained toolchain: libLLVM.so in lib/,
      # fly + ld.lld resolving it via RUNPATH $ORIGIN/../lib.

      - name: Stage 0 (bootstrap fly + fork LLVM)
        env:
          FLY_BUNDLE_LLVM: "1"
        run: chmod +x ./ci/linux/*.sh && ./ci/linux/stage0.sh

      # ── Stage-0 pass: the suites under the pinned REFERENCE seed that stage0 just
      #    downloaded, with its own bundled runtime/std. A failure here is a
      #    SOURCE-level problem, caught before a self-host build is spent on it.
      #    Every stage links the SAME fork LLVM (stage0 exported it).
      #    Non-blocking for now: a known set still faults under the reference.
      - name: Test stage 0 (reference compiler)
        continue-on-error: true
        env:
          STAGE: "0"
        run: |
          ./ci/linux/test_runtime.sh
          ./ci/linux/test_std.sh
          ./ci/linux/test_compiler.sh

      - name: Stage 1 (bootstrap builds the self-host)
        env:
          FLY_BUNDLE_LLVM: "1"
        run: ./ci/linux/stage1.sh

      # ── Stage-1 pass: the suites under the self-host stage1 just built WITH the
      #    reference. A suite that passed at STAGE=0 and fails here indicts the
      #    self-host codegen. Non-blocking for now: a known set still fails.
      - name: Test stage 1 (self-host built by the reference)
        continue-on-error: true
        env:
          STAGE: "1"
        run: |
          ./ci/linux/test_runtime.sh
          ./ci/linux/test_std.sh
          ./ci/linux/test_compiler.sh

      - name: Stage 2 (self-host rebuilds the shipped artifacts)
        env:
          FLY_BUNDLE_LLVM: "1"
        run: ./ci/linux/stage2.sh

      # ── Tests, after stage 2: EVERYTHING compiles and runs with
      #    build/stage2/bin/fly — the artifact that ships is exercised
      #    end-to-end (the --test system is ported to the self-host; all
      #    suites are green under it). The FLY defaults live in the test
      #    scripts themselves (override with FLY=… to test another build). ─────

      # ── Stage-2 pass: the suites under the self-host stage2 just built WITH the
      # self-host — the shipped fixpoint artifact. A suite that passed at STAGE=1
      # and fails here indicts stage2 codegen. These stay BLOCKING: this is what
      # users get.
      # Test order: runtime → std → compiler → driver (bottom-up: the runtime
      # underpins std, which the compiler + driver both build on, so a failure is
      # reported at the lowest broken layer first).

      # Runtime unit tests (runtime/test) — the fly.runtime libc/libm FFI backend,
      # exercised by the per-platform Runtime*Suite.fly (suite/case, --test; the
      # harness runs only the host platform's suite).
      - name: Test runtime
        env:
          STAGE: "2"
        run: ./ci/linux/test_runtime.sh

      # Standard library suites (std/test/**/*Suite.fly, run with --test):
      # data/ containers, core/ str+math+mem+bridge, os/ env+fs+io+path+time+proc,
      # lang/ casts+enums+generics+interfaces+override/super, meta/ manifest schema.
      - name: Test std
        env:
          STAGE: "2"
        run: ./ci/linux/test_std.sh

      # Compiler unit suites - now INCLUDES the driver + package-manager suites
      # under compiler/test/driver (CLI parsing, Manifest/lockfile, semver/MVS
      # resolver, registry, ToolChain, cache/checksum/json): the driver is
      # compiled INTO the compiler monolithically, so there is no separate
      # test_driver step anymore.
      - name: Test self-host compiler
        env:
          STAGE: "2"
        run: ./ci/linux/test_compiler.sh

      # Diagnostic (non-blocking): sweep EVERY test suite (runtime, std, compiler,
      # driver) under Valgrind memcheck to catch double-free / use-after-free bugs
      # — the owned-string aliasing class the Windows heap aborts on
      # (e.g. Frontend.resolveSourceDeps, 0xC0000374) but glibc silently tolerates
      # here. Valgrind flags each invalid free and prints the symbolized alloc +
      # both free stacks (needs FLY_DEBUG_SYMBOLS=1, the default on push/dispatch).
      # Slow (the compiler runs libLLVM per suite); scope with VG_SUITES / VG_LIMIT.
      # Also runnable locally: ./ci/linux/valgrind_check.sh
      # - name: Valgrind memcheck (all suites)
      #   if: always()
      #   continue-on-error: true
      #   run: |
      #     sudo apt-get update -qq && sudo apt-get install -y -qq valgrind
      #     ./ci/linux/valgrind_check.sh

      - name: Set artifact name
        id: artifact
        shell: bash
        run: |
          BRANCH="${{ github.ref_name }}"
          echo "artifact_name=linux-artifact-${BRANCH//\//-}" >> $GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.artifact_name }}
          # Both dirs: the artifact root is their common ancestor (build/stage2),
          # so it preserves the bin/ + lib/ layout the release archive needs.
          path: |
            build/stage2/bin
            build/stage2/lib
          if-no-files-found: error
          overwrite: true
