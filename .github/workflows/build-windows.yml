name: Build Windows

on:
  workflow_call:
    inputs:
      debug_symbols:
        description: '"1" embeds DWARF (crash → source line); "0" for lean release artifacts.'
        required: false
        type: string
        default: "1"
  push:
    paths-ignore:
      - '.github/workflows/**'
    branches:
      - release/*
  workflow_dispatch:

env:
  # stage0 bootstrap release (compiles the stage-1 world; see the stage map
  # below). Cut from the current fly/ reference; the version pin is THIS variable.
  FLY_VERSION: "0.13.10"

jobs:

  build-windows:
    runs-on: windows-latest
    # Emit DWARF into the stage-1 build (stage0 honours --debug-symbols; the
    # self-host does not yet) so a crash symbolizes to a source line via
    # llvm-symbolizer. release.yml passes debug_symbols="0" for lean artifacts;
    # plain push / workflow_dispatch default to "1".
    env:
      FLY_DEBUG_SYMBOLS: ${{ inputs.debug_symbols == '0' && '0' || '1' }}

    steps:
      - uses: actions/checkout@v4

      # NO Visual Studio / Windows SDK: the Windows toolchain targets
      # x86_64-w64-windows-gnu (UCRT) and links with the fork's own lld (as ld.lld)
      # against the bundled mingw sysroot — see ci/windows/gnu_common.ps1. That is
      # the whole point of this pipeline, so there is no ilammy/msvc-dev-cmd step.

      # fly needs three files from the ~900 MB fork LLVM artifact: LLVM-C.lib (link
      # import lib), LLVM-C.dll (loaded at runtime; the self-host calls the LLVM C
      # API) and lld-link.exe (the fork linker, also used as ld.lld). Cache them.
      - name: Cache LLVM (fly-lang build)
        id: llvm-cache
        uses: actions/cache@v4
        with:
          path: build/llvm
          # Version pin lives in ci/windows/stage0.ps1 ($LLVM_VERSION); keep this
          # key in sync when bumping it so a new LLVM invalidates the cache.
          key: fly-llvm-20.1.8-win-x64

      # The mingw/UCRT sysroot (import libs + CRT startup + compiler-rt builtins)
      # that fly links against — no Visual Studio. stage0.ps1 fetches it from
      # mstorsjo/llvm-mingw into build/mingw (~62 MB). Cache keyed on MINGW_VERSION
      # (ci/windows/gnu_common.ps1); bump both together.
      - name: Cache mingw/UCRT sysroot (llvm-mingw)
        id: mingw-cache
        uses: actions/cache@v4
        with:
          path: build/mingw
          key: fly-mingw-20260616-ucrt-x64

      # ── Rust-style staged bootstrap (see ci/windows/stage1.ps1; mirrors the
      #    Linux pipeline in ci/linux/) ─────────────────────────────────────────
      # stage0  ci/windows/stage0.ps1: the downloaded bootstrap compiler ($FLY_VERSION) +
      #         its precompiled lib → build\stage0, and the fork LLVM pieces
      #         (LLVM-C.lib/.dll + lld-link.exe) → build\llvm. No package manager.
      # stage1  ci/windows/stage1.ps1: stage0 builds runtime(seed), std, compiler
      #         and driver FROM IN-TREE SOURCES and links the first fly.exe, all
      #         into build\stage1 (build-only). The std ships from this stage
      #         (reference class ABI).
      # stage2  ci/windows/stage2.ps1: build\stage1\bin\fly.exe rebuilds the
      #         driver into the SHIPPED build\stage2 (the self-hosting fixpoint
      #         check). The compiler lib stays stage0-built, like Rust's
      #         beta-built rustc. While the self-host Windows link path is being
      #         validated in CI, a stage-2 failure falls back to shipping the
      #         stage1 artifacts (warning in the log) — the artifact layout is
      #         always complete.
      # FLY_BUNDLE_LLVM=1 ships a self-contained toolchain next to fly.exe:
      # LLVM-C.dll (loaded at runtime), ld.lld.exe (the linker fly forks) and the
      # mingw/UCRT sysroot (mingw\ — import libs + CRT + builtins fly links against).
      # No Visual Studio needed to build OR to use fly on Windows.

      - name: Stage 0 (bootstrap fly + fork LLVM)
        env:
          FLY_BUNDLE_LLVM: "1"
        shell: pwsh
        run: .\ci\windows\stage0.ps1

      # ── Stage-0 pass: the suites under the pinned REFERENCE seed that stage0 just
      #    downloaded, with its own bundled runtime/std. A failure here is a
      #    SOURCE-level problem, caught before a self-host build is spent on it.
      #    Every stage links the SAME fork LLVM (stage0 exported it).
      #    Non-blocking for now: a known set still faults under the reference.
      - name: Test stage 0 (reference compiler)
        continue-on-error: true
        shell: pwsh
        env:
          STAGE: '0'
        run: |
          .\ci\windows\test_runtime.ps1
          .\ci\windows\test_std.ps1
          .\ci\windows\test_compiler.ps1

      - name: Stage 1 (bootstrap builds the self-host)
        shell: pwsh
        env:
          FLY_BUNDLE_LLVM: "1"
        run: .\ci\windows\stage1.ps1

      # ── Stage-1 pass: the suites under the self-host stage1 just built WITH the
      #    reference. A suite that passed at STAGE=0 and fails here indicts the
      #    self-host codegen. Non-blocking for now: a known set still fails.
      - name: Test stage 1 (self-host built by the reference)
        continue-on-error: true
        shell: pwsh
        env:
          STAGE: '1'
        run: |
          .\ci\windows\test_runtime.ps1
          .\ci\windows\test_std.ps1
          .\ci\windows\test_compiler.ps1

      - name: Stage 2 (self-host rebuilds the shipped artifacts)
        shell: pwsh
        env:
          FLY_BUNDLE_LLVM: "1"
        run: .\ci\windows\stage2.ps1

      # ── Stage-2 pass: the suites under the self-host stage2 just built WITH the
      # self-host — the shipped fixpoint artifact. A suite that passed at STAGE=1
      # and fails here indicts stage2 codegen. These stay BLOCKING: this is what
      # users get.
      # Test order: runtime → std → compiler → driver (bottom-up: the runtime
      # underpins std, which the compiler + driver both build on, so a failure is
      # reported at the lowest broken layer first).
      - name: Test runtime
        continue-on-error: false
        shell: pwsh
        env:
          STAGE: '2'
        run: .\ci\windows\test_runtime.ps1

      - name: Test std
        continue-on-error: false
        shell: pwsh
        env:
          STAGE: '2'
        run: .\ci\windows\test_std.ps1

      # Non-blocking: a subset of codegen suites is non-deterministically unstable
      # on the x86_64-w64-windows-gnu target (a bootstrap-compiler bug, not the
      # scripts). The build artifact is still produced/uploaded and the full suite
      # results show in the log. Make strict again once stable.
      - name: Test self-host compiler
        id: test_compiler
        continue-on-error: false
        shell: pwsh
        env:
          STAGE: '2'
        run: .\ci\windows\test_compiler.ps1

      # Windows mirror of build-linux.yml's gdb "Backtrace on Crash": if a suite
      # faulted (heap corruption / access violation), re-run the crash-prone
      # suites under ProcDump and symbolize each fly.exe frame with
      # llvm-symbolizer against the DWARF the debug build embeds -> fly source
      # function:line. Runs whether or not the test step is continue-on-error.
      - name: Backtrace on Crash
        if: always() && steps.test_compiler.outcome == 'failure'
        shell: pwsh
        run: .\ci\windows\backtrace_on_crash.ps1

      - uses: actions/upload-artifact@v4
        if: always() && steps.test_compiler.outcome == 'failure'
        with:
          name: windows-crashdumps
          path: build/crashdumps
          if-no-files-found: ignore

      - name: Set artifact name
        id: artifact
        shell: bash
        run: |
          BRANCH="${{ github.ref_name }}"
          echo "artifact_name=windows-artifact-${BRANCH//\//-}" >> $GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.artifact_name }}
          # Both dirs: the artifact root is their common ancestor (build/stage2),
          # so it preserves the bin/ + lib/ layout the release archive needs.
          path: |
            build/stage2/bin
            build/stage2/lib
          if-no-files-found: error
          overwrite: true
