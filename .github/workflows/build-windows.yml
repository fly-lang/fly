name: Build Windows

on:
  workflow_call:
    inputs:
      debug_symbols:
        description: '"1" embeds DWARF (crash → source line); "0" for lean release artifacts.'
        required: false
        type: string
        default: "1"
  push:
    paths-ignore:
      - '.github/workflows/**'
    branches:
      - release/*
  workflow_dispatch:

# The stage0 seed version is NOT set here. Its single source of truth is the
# $FLY_VERSION default in ci/windows/stage0.ps1 (and ci/linux/stage0.sh), which
# also documents why each pin was needed. A workflow-level FLY_VERSION overrides
# that default — the script honours the environment — so a copy here silently
# drifts: this file once pinned 0.13.15 while the scripts had moved to 0.13.18,
# and CI bootstrapped from a seed that could not parse the tree. To test another
# seed, set FLY_VERSION on a one-off workflow_dispatch run, never as a default.

jobs:

  build-windows:
    runs-on: windows-latest
    # Emit DWARF into every stage (the seed at stage 1, the self-host from stage 2)
    # so a crash symbolizes to a source line via llvm-symbolizer. release.yml
    # passes debug_symbols="0" for lean artifacts; plain push /
    # workflow_dispatch default to "1".
    env:
      FLY_DEBUG_SYMBOLS: ${{ inputs.debug_symbols == '0' && '0' || '1' }}

    steps:
      - uses: actions/checkout@v4

      # NO Visual Studio / Windows SDK: the Windows toolchain targets
      # x86_64-w64-windows-gnu (UCRT) and links with the fork's own lld (as ld.lld)
      # against the bundled mingw sysroot — see ci/windows/gnu_common.ps1. That is
      # the whole point of this pipeline, so there is no ilammy/msvc-dev-cmd step.

      # fly extracts from the fork LLVM artifact: LLVM-C.lib (link import lib),
      # LLVM-C.dll (loaded at runtime; the self-host calls the LLVM C API), the
      # linker under both original names (ld.lld.exe + lld-link.exe) and the
      # debugger the release bundles (lldb.exe + liblldb.dll + lldb-dap.exe +
      # lldb-argdumper.exe). Cache them.
      - name: Cache LLVM (fly-lang build)
        id: llvm-cache
        uses: actions/cache@v4
        with:
          path: build/llvm
          # Version pin lives in ci/windows/stage0.ps1 ($LLVM_VERSION); keep this
          # key in sync when bumping it so a new LLVM invalidates the cache, and
          # bump the -vN suffix whenever stage0's extracted file list changes: a
          # stale cache passes the script's completeness check and actions/cache
          # never re-saves an existing key. (-v2: adds ld.lld.exe + the lldb set.)
          key: fly-llvm-20.1.8-win-x64-v2

      # The mingw/UCRT sysroot (import libs + CRT startup + compiler-rt builtins)
      # that fly links against — no Visual Studio. stage0.ps1 fetches it from
      # mstorsjo/llvm-mingw into build/mingw (~62 MB). Cache keyed on MINGW_VERSION
      # (ci/windows/gnu_common.ps1); bump both together.
      - name: Cache mingw/UCRT sysroot (llvm-mingw)
        id: mingw-cache
        uses: actions/cache@v4
        with:
          path: build/mingw
          key: fly-mingw-20260616-ucrt-x64

      # ── Rust-style staged bootstrap (see ci/windows/stage1.ps1; mirrors the
      #    Linux pipeline in ci/linux/) ─────────────────────────────────────────
      # stage0  ci/windows/stage0.ps1: the downloaded bootstrap compiler ($FLY_VERSION) +
      #         its precompiled lib → build\stage0, and the fork LLVM pieces
      #         (LLVM-C.lib/.dll + lld-link.exe) → build\llvm. No package manager.
      # stage1  ci/windows/stage1.ps1: stage0 builds runtime(seed), std, compiler
      #         and driver FROM IN-TREE SOURCES and links the first fly.exe, all
      #         into build\stage1 (build-only). The std ships from this stage
      #         (reference class ABI).
      # stage2  ci/windows/stage2.ps1: build\stage1\bin\fly.exe recompiles the
      #         compiler + driver (one monolithic object) into the SHIPPED
      #         build\stage2. A stage-2 failure is FATAL, as on Linux: there is
      #         no fallback to the stage1 artifacts, so what gets uploaded is
      #         always the self-host-built compiler.
      # FLY_BUNDLE_LLVM=1 ships a self-contained toolchain next to fly.exe:
      # LLVM-C.dll (loaded at runtime), ld.lld.exe (the linker fly forks) and the
      # mingw/UCRT sysroot (mingw\ — import libs + CRT + builtins fly links against).
      # No Visual Studio needed to build OR to use fly on Windows.

      - name: Stage 0 (bootstrap fly + fork LLVM)
        env:
          FLY_BUNDLE_LLVM: "1"
        shell: pwsh
        run: .\ci\windows\stage0.ps1

      # Stage 1 builds, then tests with the fly.exe it just linked (see
      # stage1.ps1). The seed no longer runs anything: the reference dropped its
      # CLI test runner (--test/--suite) in 0.13.15, which also retired the 3
      # residual reference-side defects this step used to work around.
      # FLY_STAGE1_TESTS=0 keeps stage1's own test steps off here only so that
      # the "Test stage 1" step below reports them under its own name; they are
      # fatal in both places. Every stage links the SAME fork LLVM.
      - name: Stage 1 (bootstrap builds the self-host)
        shell: pwsh
        env:
          FLY_BUNDLE_LLVM: "1"
          FLY_STAGE1_TESTS: "0"
        run: .\ci\windows\stage1.ps1

      # ── Stage-1 pass: the suites under the self-host stage1 just built WITH the
      #    reference. A failure here indicts the self-host as the SEED compiles
      #    it. BLOCKING since 0.14.7: the set that used to fail is gone, and a
      #    stage-1 compiler that fails its own suites must not go on to build the
      #    stage that ships.
      - name: Test stage 1 (self-host built by the reference)
        shell: pwsh
        env:
          STAGE: '1'
        # The exit code is tested after EACH script: a pwsh `run` block only
        # reports the LAST command, so a red test_runtime followed by a green
        # test_compiler would pass the step.
        run: |
          foreach ($t in 'test_runtime', 'test_std', 'test_compiler') {
            & ".\ci\windows\$t.ps1"
            if ($LASTEXITCODE -ne 0) { Write-Host "error: $t.ps1 failed (exit $LASTEXITCODE)"; exit 1 }
          }

      - name: Stage 2 (self-host rebuilds the shipped artifacts)
        shell: pwsh
        env:
          FLY_BUNDLE_LLVM: "1"
        run: .\ci\windows\stage2.ps1

      # ── Stage-2 pass: the suites under the self-host stage2 just built WITH the
      # self-host — the shipped fixpoint artifact. A suite that passed at STAGE=1
      # and fails here indicts stage2 codegen. These stay BLOCKING: this is what
      # users get.
      # Test order: runtime → std → compiler → driver (bottom-up: the runtime
      # underpins std, which the compiler + driver both build on, so a failure is
      # reported at the lowest broken layer first).
      - name: Test runtime
        continue-on-error: false
        shell: pwsh
        env:
          STAGE: '2'
        run: .\ci\windows\test_runtime.ps1

      - name: Test std
        continue-on-error: false
        shell: pwsh
        env:
          STAGE: '2'
        run: .\ci\windows\test_std.ps1

      # Non-blocking: a subset of codegen suites is non-deterministically unstable
      # on the x86_64-w64-windows-gnu target (a bootstrap-compiler bug, not the
      # scripts). The build artifact is still produced/uploaded and the full suite
      # results show in the log. Make strict again once stable.
      - name: Test self-host compiler
        id: test_compiler
        continue-on-error: false
        shell: pwsh
        env:
          STAGE: '2'
        run: .\ci\windows\test_compiler.ps1

      # Windows mirror of build-linux.yml's gdb "Backtrace on Crash": if a suite
      # faulted (heap corruption / access violation), re-run the crash-prone
      # suites under ProcDump and symbolize each fly.exe frame with
      # llvm-symbolizer against the DWARF the debug build embeds -> fly source
      # function:line. Runs whether or not the test step is continue-on-error.
      - name: Backtrace on Crash
        if: always() && steps.test_compiler.outcome == 'failure'
        shell: pwsh
        run: .\ci\windows\backtrace_on_crash.ps1

      - uses: actions/upload-artifact@v4
        if: always() && steps.test_compiler.outcome == 'failure'
        with:
          name: windows-crashdumps
          path: build/crashdumps
          if-no-files-found: ignore

      # Every build: the bootstrap fixpoint. The shipped stage2 compiler recompiles
      # the compiler and the object must be byte-identical to the one stage1
      # produced - otherwise the self-host's codegen depends on which compiler
      # built it, which no suite can see (a suite runs one compiler). It costs one
      # more compile of the compiler (seconds). BLOCKING. It used to run on release
      # builds only, and the first release found a seed defect the pushes had
      # carried for weeks (a null upcast made non-null: see ASTBuilder.CreateParam).
      - name: Stage 3 (fixpoint check)
        shell: pwsh
        run: .\ci\windows\stage3.ps1

      # Every build: what ships is REPRODUCIBLE. Stage 2 is rebuilt from scratch
      # with the same stage-1 compiler and every file of build\stage2\{bin,lib} must
      # come out byte-identical (stage 3 only compares the compiler object). Costs
      # one more build of runtime, std, compiler and tools. BLOCKING.
      - name: Reproducible build check
        shell: pwsh
        env:
          FLY_BUNDLE_LLVM: "1"
        run: .\ci\windows\repro_check.ps1

      - name: Set artifact name
        id: artifact
        shell: bash
        run: |
          BRANCH="${{ github.ref_name }}"
          echo "artifact_name=windows-artifact-${BRANCH//\//-}" >> $GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.artifact_name }}
          # Both dirs: the artifact root is their common ancestor (build/stage2),
          # so it preserves the bin/ + lib/ layout the release archive needs.
          path: |
            build/stage2/bin
            build/stage2/lib
          if-no-files-found: error
          overwrite: true
