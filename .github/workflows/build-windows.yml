name: Build Windows

on:
  workflow_call:
  push:
    paths-ignore:
      - '.github/workflows/**'
    branches:
      - release/*
  workflow_dispatch:

env:
  # stage0 bootstrap release (compiles the stage-1 world; see the stage map
  # below). 0.13.8 is cut from the current fly/ reference.
  FLY_VERSION: "0.13.8"

jobs:

  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # Put the MSVC toolchain + Windows SDK on LIB/INCLUDE/PATH for the whole job.
      # The bootstrap links fly.exe in-process (lld::coff::link) and needs the SDK
      # import libs (kernel32.lib, ws2_32.lib, …) on %LIB%, which a plain pwsh shell
      # does not expose. amd64 matches the x86_64 target.
      - name: Set up MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      # The released fly.exe statically embeds LLVM + LLD (it links in-process via
      # lld::coff::link), so no external lld-link/clang is needed. What IS needed
      # is an LLVM import lib + runtime DLL for the program fly builds, because the
      # self-host compiler calls the LLVM C API. We only need three files from the
      # ~900 MB LLVM artifact: LLVM-C.lib (link import lib), LLVM-C.dll (loaded at
      # runtime) and lld-link.exe (the bundled COFF linker); cache them across runs
      # keyed on the LLVM version.
      - name: Cache LLVM (fly-lang build)
        id: llvm-cache
        uses: actions/cache@v4
        with:
          path: build/llvm
          # Version pin lives in ci/windows/stage0.ps1 ($LLVM_VERSION); keep this
          # key in sync when bumping it so a new LLVM invalidates the cache.
          key: fly-llvm-20.1.8-win-x64

      # ── Rust-style staged bootstrap (see ci/windows/stage1.ps1; mirrors the
      #    Linux pipeline in ci/linux/) ─────────────────────────────────────────
      # stage0  ci/windows/stage0.ps1: the downloaded 0.13.8 bootstrap compiler +
      #         its precompiled lib → build\stage0, and the fork LLVM pieces
      #         (LLVM-C.lib/.dll + lld-link.exe) → build\llvm. No package manager.
      # stage1  ci/windows/stage1.ps1: stage0 builds runtime(seed), std, compiler
      #         and driver FROM IN-TREE SOURCES and links the first fly.exe, all
      #         into build\stage1 (build-only). The std ships from this stage
      #         (reference class ABI).
      # stage2  ci/windows/stage2.ps1: build\stage1\bin\fly.exe rebuilds the
      #         driver into the SHIPPED build\stage2 (the self-hosting fixpoint
      #         check). The compiler lib stays stage0-built, like Rust's
      #         beta-built rustc. While the self-host Windows link path is being
      #         validated in CI, a stage-2 failure falls back to shipping the
      #         stage1 artifacts (warning in the log) — the artifact layout is
      #         always complete.
      # FLY_BUNDLE_LLVM=1 ships a self-contained toolchain: LLVM-C.dll + the
      # fork's lld-link.exe next to fly.exe (the loader searches the exe dir —
      # no rpath on Windows).

      - name: Stage 0 (bootstrap fly + fork LLVM)
        env:
          FLY_BUNDLE_LLVM: "1"
        shell: pwsh
        run: .\ci\windows\stage0.ps1

      - name: Stage 1 (bootstrap builds the self-host)
        shell: pwsh
        env:
          FLY_BUNDLE_LLVM: "1"
        run: .\ci\windows\stage1.ps1

      - name: Stage 2 (self-host rebuilds the shipped artifacts)
        shell: pwsh
        env:
          FLY_BUNDLE_LLVM: "1"
        run: .\ci\windows\stage2.ps1

      # ── Tests, after stage 2: everything compiles and runs with
      #    build\stage2\bin\fly.exe (mirrors Linux; the --test system is ported
      #    to the self-host). The FLY defaults live in the test scripts.
      # Non-blocking: a subset of codegen suites is non-deterministically unstable
      # on the x86_64-pc-windows-msvc target (a bootstrap-compiler bug, not the
      # scripts). The build artifact is still produced/uploaded and the full suite
      # results show in the log. Make strict again once stable.
      - name: Test self-host compiler
        continue-on-error: false
        shell: pwsh
        run: .\ci\windows\test_compiler.ps1

      - name: Test driver
        continue-on-error: false
        shell: pwsh
        run: .\ci\windows\test_driver.ps1

      - name: Test runtime
        continue-on-error: false
        shell: pwsh
        run: .\ci\windows\test_runtime.ps1

      - name: Test std
        continue-on-error: false
        shell: pwsh
        run: .\ci\windows\test_std.ps1

      - name: Set artifact name
        id: artifact
        shell: bash
        run: |
          BRANCH="${{ github.ref_name }}"
          echo "artifact_name=windows-artifact-${BRANCH//\//-}" >> $GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.artifact_name }}
          # Both dirs: the artifact root is their common ancestor (build/stage2),
          # so it preserves the bin/ + lib/ layout the release archive needs.
          path: |
            build/stage2/bin
            build/stage2/lib
          if-no-files-found: error
          overwrite: true
